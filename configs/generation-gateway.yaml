# Phase 2 (HLD 018): a stronger model through an OpenAI-compatible LLM gateway (e.g. Bifrost).
# Retrieval is identical to generation-ollama.yaml, so only the generator changes. See docs/runbooks/gateway-generation-run.md.
experiment_name: generation-gateway
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base
  respect_pages: true            # <- vs filters.yaml
  context:                       # <- vs pages.yaml
    enabled: true
    document_fields: [company, doc_type, year]
    page_title: true
    max_title_lines: 8

embedding:                 # ADR 0003
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
  device: auto

retrieval:
  top_k: 5
  filters:
    enabled: true
    fields: [company, year]
    year_window: 0
    relax_order: [year, company]
    short_fiscal_years: true
    forward_looking_prior_year: true
  rewrite:
    strip_boilerplate: true
    expand_abbreviations: true
    keep_original: true

generation:                     # <- vs generation-ollama.yaml: model behind an LLM gateway
  provider: openai_compatible
  model_id: "<gateway-model-id>"   # SET THIS to the model name your gateway expects
  max_tokens: 2048
  max_sources: 5
  gateway_url_env: LLM_GATEWAY_URL # base URL lives in .env, never here
  gateway_key_env: LLM_GATEWAY_KEY
  gateway_key_header: Authorization  # or your gateway's key header, e.g. x-bf-vk
  gateway_timeout_s: 300
  pricing: {input_per_mtok: 3.0, output_per_mtok: 15.0}  # SET to your model's price (USD / 1M tokens)
  expected_output_tokens: 800

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
