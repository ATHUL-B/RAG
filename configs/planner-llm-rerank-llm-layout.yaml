# Ablation 3.5b (HLD 014): local LLM (llama3.1:8b) grades each of the top 20 fused candidates
# Only change vs planner-llm.yaml: the rerank block. Judged on the dev split.
experiment_name: planner-llm-rerank-llm-layout
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf-layout          # <- vs planner-llm-rerank-llm.yaml (HLD 021)

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base
  respect_pages: true            # <- vs filters.yaml
  context:                       # <- vs pages.yaml
    enabled: true
    document_fields: [company, doc_type, year]
    page_title: true
    max_title_lines: 8

embedding:                 # ADR 0003
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
  device: auto

retrieval:
  top_k: 5
  rerank:                          # <- vs planner-llm.yaml
    enabled: true
    kind: llm
    depth: 20
    llm:
      model_id: llama3.1:8b
      context_tokens: 4096
      max_passage_chars: 3000
  filters:
    enabled: true
    fields: [company, year]
    year_window: 0
    relax_order: [year, company]
    short_fiscal_years: true
    forward_looking_prior_year: true
  rewrite:
    strip_boilerplate: true
    expand_abbreviations: true
    keep_original: true
    llm_planner:
      enabled: true
      model_id: llama3.1:8b
      max_sub_queries: 4

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
