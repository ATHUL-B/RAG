# Ablation 3.6 (HLD 011, rule-based query planner): strip instruction boilerplate; search original + cleaned, fused with RRF
# Only change vs pages-context.yaml: see the commented line(s). Judged on the dev split.
experiment_name: planner-clean
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base
  respect_pages: true            # <- vs filters.yaml
  context:                       # <- vs pages.yaml
    enabled: true
    document_fields: [company, doc_type, year]
    page_title: true
    max_title_lines: 8

embedding:                 # ADR 0003
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
  device: auto

retrieval:
  top_k: 5
  filters:
    enabled: true
    fields: [company, year]
    year_window: 0
    relax_order: [year, company]
  rewrite:
    strip_boilerplate: true          # <- vs pages-context.yaml
    keep_original: true

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
