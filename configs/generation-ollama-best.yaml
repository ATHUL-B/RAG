# Phase 2 (HLD 015): local Ollama answers from the BEST-QUALITY retrieval
# (planner-llm-rerank-llm: LLM planner + LLM reranker). Only change vs generation-ollama.yaml: retrieval.
experiment_name: generation-ollama-best
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base
  respect_pages: true            # <- vs filters.yaml
  context:                       # <- vs pages.yaml
    enabled: true
    document_fields: [company, doc_type, year]
    page_title: true
    max_title_lines: 8

embedding:                 # ADR 0003
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
  device: auto

retrieval:
  top_k: 5
  rerank:
    enabled: true
    kind: llm
    depth: 20
    llm:
      model_id: llama3.1:8b
      context_tokens: 4096
      max_passage_chars: 3000
  filters:
    enabled: true
    fields: [company, year]
    year_window: 0
    relax_order: [year, company]
    short_fiscal_years: true
    forward_looking_prior_year: true
  rewrite:
    strip_boilerplate: true
    expand_abbreviations: true
    keep_original: true
    llm_planner:
      enabled: true
      model_id: llama3.1:8b
      max_sub_queries: 4

generation:                     # <- vs generation-claude.yaml: local model via Ollama
  provider: ollama
  model_id: llama3.1:8b
  max_sources: 5
  ollama_url: http://localhost:11434
  ollama_timeout_s: 300
  ollama_context_tokens: 8192    # explicit: Ollama silently truncates beyond its default
  max_tokens: 1024               # num_predict: a looping answer stops instead of running on
  pricing: {input_per_mtok: 0.0, output_per_mtok: 0.0}
  expected_output_tokens: 500

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
