# Backlog 4.2 (HLD 028): baseline.yaml with the from-scratch HNSW index instead of exact search.
# Only change: retrieval.dense_index (lines marked <-).
# Baseline experiment (study guide, Part 15 learning path, step 1).
# One config file = one experiment. Copy and change ONE thing for an ablation.
experiment_name: baseline-hnsw
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base

embedding:                 # ADR 0003
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
  device: auto

retrieval:
  top_k: 5
  dense_index:                     # <- vs baseline.yaml
    kind: hnsw
    m: 16
    ef_construction: 100
    ef_search: 64
    exact_below: 2000
    seed: 0
  filters:
    enabled: false

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
