# Ablation 3.5 (HLD 008): hybrid pool + MiniLM-L-6 cross-encoder.
# Only change vs hybrid.yaml: retrieval.rerank.
experiment_name: rerank-minilm
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base

embedding:                 # ADR 0003
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
  device: auto

retrieval:
  top_k: 5
  mode: hybrid
  candidate_depth: 50
  bm25: {k1: 1.2, b: 0.75}
  fusion: {rrf_k: 60, weights: {dense: 1.0, bm25: 1.0}}
  rerank:
    enabled: true
    model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
    revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
    depth: 50
    batch_size: 16
    max_length: 512
    device: auto
  filters:
    enabled: true
    fields: [company, year]
    year_window: 0
    relax_order: [year, company]

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
