# Ablation 3.2 (HLD 009): chunks never cross a page.
# Only change vs filters.yaml: see the commented line(s).
experiment_name: pages
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base
  respect_pages: true            # <- vs filters.yaml

embedding:                 # ADR 0003
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
  device: auto

retrieval:
  top_k: 5
  filters:
    enabled: true
    fields: [company, year]
    year_window: 0
    relax_order: [year, company]

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
