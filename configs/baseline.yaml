# Baseline experiment (study guide, Part 15 learning path, step 1).
# One config file = one experiment. Copy and change ONE thing for an ablation.
experiment_name: baseline
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base

retrieval:
  top_k: 5

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
