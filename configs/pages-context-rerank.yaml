# Ablation 3.2 (HLD 009): + bge-reranker-base (re-test HLD 008).
# Only change vs pages-context.yaml: see the commented line(s).
experiment_name: pages-context-rerank
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base
  respect_pages: true            # <- vs filters.yaml
  context:                       # <- vs pages.yaml
    enabled: true
    document_fields: [company, doc_type, year]
    page_title: true
    max_title_lines: 8

embedding:                 # ADR 0003
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
  device: auto

retrieval:
  top_k: 5
  rerank:                        # <- vs pages-context.yaml
    enabled: true
    model_id: BAAI/bge-reranker-base
    revision: 2cfc18c9415c912f9d8155881c133215df768a70
    depth: 50
    batch_size: 16
    max_length: 512
    device: auto
  filters:
    enabled: true
    fields: [company, year]
    year_window: 0
    relax_order: [year, company]

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
