# Ablation 3.2 (HLD 009): + dense/BM25 hybrid.
# Only change vs pages-context.yaml: see the commented line(s).
experiment_name: pages-context-hybrid
dataset: financebench

paths:
  data_dir: data
  runs_dir: runs

parsing:
  parser: pypdf

chunking:
  strategy: recursive
  chunk_size: 400      # tokens
  chunk_overlap: 0
  tokenizer: cl100k_base
  respect_pages: true            # <- vs filters.yaml
  context:                       # <- vs pages.yaml
    enabled: true
    document_fields: [company, doc_type, year]
    page_title: true
    max_title_lines: 8

embedding:                 # ADR 0003
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64
  device: auto

retrieval:
  top_k: 5
  mode: hybrid                   # <- vs pages-context.yaml
  candidate_depth: 50
  bm25: {k1: 1.2, b: 0.75}
  fusion: {rrf_k: 60, weights: {dense: 1.0, bm25: 1.0}}
  filters:
    enabled: true
    fields: [company, year]
    year_window: 0
    relax_order: [year, company]

evaluation:
  ks: [1, 3, 5, 10]
  parse_audit_min_coverage: 0.8
