name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: make check

  # Retrieval regression gate (backlog 4.3, HLD 024): 32 dev questions over the 14 filings
  # of 7 companies, default retrieval config, CPU only, no LLM. Fails if retrieval regresses.
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('configs/planner-rules.yaml') }}
      - name: Cache the gate PDFs
        uses: actions/cache@v4
        with:
          path: data/gate/raw
          key: gate-pdfs-${{ hashFiles('evals/gate-v1.json') }}
      - run: make gate
