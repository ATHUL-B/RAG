[project]
name = "rag-lab"
version = "0.1.0"
description = "A production-grade RAG system built step by step for learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.9",
    "pypdf[crypto]>=7.1.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.3",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
    "PTH",      # use pathlib
    "T20",      # no print() in library code
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not slow'"
markers = [
    "slow: needs real models, network or large data; excluded by default (run with -m slow)",
]
